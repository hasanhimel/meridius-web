<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1970 1760"
     width="1970" height="1760">
  <title>Cursor Scroll Apex-Flip Motion Path</title>
  <desc>
    Two motion paths for a custom cursor that flips its apex (pointer tip) between
    up and down on scroll-direction change, instead of rotating 180deg in place.
    Left panel: scrolling down, apex flips from up to down (hooks right).
    Right panel: scrolling up, apex flips from down to up (hooks left, mirrored).
    Both were digitized from a hand-drawn sketch by tracing and skeletonizing the
    ink, then fit with a smooth Catmull-Rom-derived cubic-bezier curve.
  </desc>

  <!-- Semantic motion-path metadata for AI/code generation -->
  <metadata id="motion-spec">{"name":"cursor-scroll-apex-flip-motion","type":"cursor-apex-flip-motion-path","rule":"apex points up while scrolling up, down while scrolling down; flips via a curved tip trajectory (not in-place rotation) that starts and ends on the same vertical line","coordinate_system":{"origin":"cursor's current on-screen position at moment of scroll-direction change","units":"normalized, y:0-to-1 = full flip travel, scale to any px size"},"motions":{"scroll_down_flip":{"start":{"x":0,"y":0,"apex_facing":"up","rotation_deg":0},"end":{"x":0,"y":1,"apex_facing":"down","rotation_deg":180},"hook_side":"right","path_d":"M 0.0000 0.0000 C 0.0133 -0.0290, 0.0200 -0.0616, 0.0398 -0.0871 C 0.0596 -0.1126, 0.0851 -0.1377, 0.1186 -0.1531 C 0.1520 -0.1684, 0.1970 -0.1776, 0.2404 -0.1792 C 0.2838 -0.1808, 0.3396 -0.1743, 0.3791 -0.1627 C 0.4187 -0.1511, 0.4500 -0.1299, 0.4776 -0.1096 C 0.5052 -0.0893, 0.5235 -0.0703, 0.5449 -0.0409 C 0.5664 -0.0114, 0.5929 0.0324, 0.6063 0.0672 C 0.6196 0.1020, 0.6224 0.1415, 0.6250 0.1679 C 0.6276 0.1944, 0.6265 0.2047, 0.6218 0.2261 C 0.6172 0.2475, 0.6155 0.2653, 0.5971 0.2966 C 0.5787 0.3280, 0.5411 0.3810, 0.5115 0.4143 C 0.4819 0.4476, 0.4716 0.4574, 0.4194 0.4963 C 0.3673 0.5351, 0.2530 0.6053, 0.1987 0.6474 C 0.1444 0.6895, 0.1197 0.7162, 0.0938 0.7491 C 0.0680 0.7819, 0.0591 0.8029, 0.0435 0.8448 C 0.0278 0.8866, 0.0145 0.9483, 0.0000 1.0000"},"scroll_up_flip":{"start":{"x":0,"y":1,"apex_facing":"down","rotation_deg":180},"end":{"x":0,"y":0,"apex_facing":"up","rotation_deg":0},"hook_side":"left","path_d":"M -0.0000 1.0000 C -0.0145 0.9483, -0.0278 0.8866, -0.0435 0.8448 C -0.0591 0.8029, -0.0680 0.7819, -0.0938 0.7491 C -0.1197 0.7162, -0.1444 0.6895, -0.1987 0.6474 C -0.2530 0.6053, -0.3673 0.5351, -0.4194 0.4963 C -0.4716 0.4574, -0.4819 0.4476, -0.5115 0.4143 C -0.5411 0.3810, -0.5787 0.3280, -0.5971 0.2966 C -0.6155 0.2653, -0.6172 0.2475, -0.6218 0.2261 C -0.6265 0.2047, -0.6276 0.1944, -0.6250 0.1679 C -0.6224 0.1415, -0.6196 0.1020, -0.6063 0.0672 C -0.5929 0.0324, -0.5664 -0.0114, -0.5449 -0.0409 C -0.5235 -0.0703, -0.5052 -0.0893, -0.4776 -0.1096 C -0.4500 -0.1299, -0.4187 -0.1511, -0.3791 -0.1627 C -0.3396 -0.1743, -0.2838 -0.1808, -0.2404 -0.1792 C -0.1970 -0.1776, -0.1520 -0.1684, -0.1186 -0.1531 C -0.0851 -0.1377, -0.0596 -0.1126, -0.0398 -0.0871 C -0.0200 -0.0616, -0.0133 -0.0290, -0.0000 0.0000"}},"rotation":{"driven_by":"progress t (0-1), independent of path tangent","scroll_down_flip":"rotation_deg = t * 180","scroll_up_flip":"rotation_deg = 180 - t * 180"},"max_bulge_ratio":0.625,"source":"traced + skeletonized from supplied hand-drawn sketch, smoothed via Catmull-Rom-to-bezier fit"}</metadata>

  <defs>
    <marker id="arrowDown" viewBox="0 0 20 20" refX="10" refY="16" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 2 2 L 18 2 L 10 18 z" fill="#111111"/>
    </marker>
    <marker id="arrowUp" viewBox="0 0 20 20" refX="10" refY="4" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M 2 18 L 18 18 L 10 2 z" fill="#111111"/>
    </marker>
  </defs>

  <style>
    text { font-family: Inter, Arial, sans-serif; fill: #111111; }
    .panel-title { font-size: 40px; font-weight: 600; }
    .label { font-size: 34px; }
    .sub { font-size: 26px; fill: #555555; }
  </style>

