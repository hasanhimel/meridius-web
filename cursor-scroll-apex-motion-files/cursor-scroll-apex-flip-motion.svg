          fill="none" stroke="#111111" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
          marker-end="url(#arrowDown)"/>

    <!-- apex-up glyph at start -->
    <path d="M 113.5 292 L 128 322 L 99 322 Z" fill="#111111"/>
    <circle cx="113.5" cy="325.6" r="7" fill="#111111"/>
    <text x="150" y="300" class="label">start</text>
    <text x="150" y="336" class="sub">apex ↑ · 0°</text>

    <text x="150" y="1400" class="label">end</text>
    <text x="150" y="1436" class="sub">apex ↓ · 180°</text>
  </g>

  <!-- ================= PANEL B — scroll up: apex down -> apex up ================= -->
  <g transform="translate(1020,100)">
    <text x="0" y="-24" class="panel-title">Scroll UP — apex flips ↑</text>

    <path d="M 792.5 1417.5 C 776.6 1361.0, 762.1 1293.7, 745.0 1248.0 C 727.9 1202.3, 718.2 1179.4, 690.0 1143.5 C 661.8 1107.6, 634.8 1078.5, 575.5 1032.5 C 516.2 986.5, 391.4 909.9, 334.5 867.5 C 277.6 825.1, 266.3 814.3, 234.0 778.0 C 201.7 741.7, 160.6 683.8, 140.5 649.5 C 120.4 615.2, 118.6 595.9, 113.5 572.5 C 108.4 549.1, 107.2 537.9, 110.0 509.0 C 112.8 480.1, 115.9 437.0, 130.5 399.0 C 145.1 361.0, 174.1 313.2, 197.5 281.0 C 220.9 248.8, 240.8 228.2, 271.0 206.0 C 301.2 183.8, 335.3 160.7, 378.5 148.0 C 421.7 135.3, 482.6 128.2, 530.0 130.0 C 577.4 131.8, 626.5 141.8, 663.0 158.5 C 699.5 175.2, 727.4 202.6, 749.0 230.5 C 770.6 258.4, 778.0 293.9, 792.5 325.6"
          fill="none" stroke="#111111" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
          marker-end="url(#arrowUp)"/>

    <!-- apex-down glyph at start (bottom) -->
    <path d="M 792.5 1451 L 807 1421 L 778 1421 Z" fill="#111111"/>
    <circle cx="792.5" cy="1417.5" r="7" fill="#111111"/>
    <text x="608" y="1400" class="label" text-anchor="end">start</text>
    <text x="608" y="1436" class="sub" text-anchor="end">apex ↓ · 180°</text>

    <text x="608" y="300" class="label" text-anchor="end">end</text>
    <text x="608" y="336" class="sub" text-anchor="end">apex ↑ · 0°</text>
  </g>

  <text x="40" y="1720" class="sub">Both paths share the same vertical anchor line and mirror each other — placed back-to-back they form one continuous closed loop (see demo HTML).</text>
</svg>
