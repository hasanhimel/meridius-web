<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- The same cursor the animated UI draws (src/site/ui/Cursor.tsx and
       .m-cur in site.css): the traced arrow in its own leaning pose, 17px tall, the button's blue with a pale sheen, a white 1.4pt
       outline, the two blue drop shadows, and the soft blue fog behind it.
       The tip is at (17, 6), the CSS hotspot. -->
  <defs>
    <radialGradient id="fog" cx="22" cy="15" r="19.8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="rgb(30,110,234)" stop-opacity="0.11"/>
      <stop offset="0.5" stop-color="rgb(30,110,234)" stop-opacity="0.04"/>
      <stop offset="0.75" stop-color="rgb(30,110,234)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b" cx="0.1" cy="0.17" r="1.15">
      <stop offset="0" stop-color="#1e82e0"/>
      <stop offset="1" stop-color="#1c38ea"/>
    </radialGradient>
    <radialGradient id="s" cx="0.66" cy="0.82" r="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgb(28,56,234)" flood-opacity="0.28" result="a"/>
      <feDropShadow in="a" dx="0" dy="1" stdDeviation="0.75" flood-color="rgb(19,26,120)" flood-opacity="0.16"/>
    </filter>
  </defs>
  <circle cx="22" cy="15" r="14" fill="url(#fog)"/>
  <g filter="url(#sh)">
    <g transform="translate(17 6) scale(0.037611) translate(-65.5 -0.9)">
