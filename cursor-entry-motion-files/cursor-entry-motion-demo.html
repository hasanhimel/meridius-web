<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Cursor Entry Motion Demo</title>
<style>
  html,body { height:100%; margin:0; background:#f5f3ee; }
  .stage { width:100%; height:100%; display:grid; place-items:center; overflow:hidden; }
  svg { width:min(100vw, 1400px); height:auto; }
  #cursor { filter: drop-shadow(0 3px 8px rgba(0,0,0,.18)); }
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 2047 1535" xmlns="http://www.w3.org/2000/svg">
  <path d="M 860 900 C 830 1010, 720 1165, 555 1218 C 390 1270, 215 1198, 190 1035 C 160 850, 285 735, 485 702 C 650 675, 805 660, 970 622 C 1160 578, 1360 500, 1480 390 C 1585 294, 1595 176, 1510 105 C 1415 25, 1245 45, 1125 95 C 980 155, 900 265, 890 380 C 878 510, 920 625, 1025 700 C 1110 762, 1215 786, 1320 785 C 1370 785, 1405 778, 1445 770" fill="none" stroke="#111" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round" opacity=".18"/>
  <circle id="cursor" cx="860" cy="900" r="18" fill="#111"/>
</svg>
</div>
<script>
const svg = document.getElementById('scene');
const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
path.setAttribute('d', `M 860 900 C 830 1010, 720 1165, 555 1218 C 390 1270, 215 1198, 190 1035 C 160 850, 285 735, 485 702 C 650 675, 805 660, 970 622 C 1160 578, 1360 500, 1480 390 C 1585 294, 1595 176, 1510 105 C 1415 25, 1245 45, 1125 95 C 980 155, 900 265, 890 380 C 878 510, 920 625, 1025 700 C 1110 762, 1215 786, 1320 785 C 1370 785, 1405 778, 1445 770`);
const length = path.getTotalLength();
const cursor = document.getElementById('cursor');

const duration = 4200; // Change to taste.
const start = performance.now();

function easeInOut(t) {
  return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
}

function frame(now) {
  const t = Math.min((now - start) / duration, 1);
  const p = path.getPointAtLength(easeInOut(t) * length);
  cursor.setAttribute('cx', p.x);
  cursor.setAttribute('cy', p.y);
  if (t < 1) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
